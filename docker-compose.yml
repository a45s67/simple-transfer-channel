services:
  app:
    build: .
    image: simple-channel:latest
    restart: unless-stopped
    ports:
      # 主機端的 port 可以在 .env 裡用 APP_PORT 換掉,容器內固定是 80
      - "${APP_PORT:-3000}:80"
    environment:
      # --- 祕密,必填,沒有就直接讓 compose 報錯不要起 ---------------------
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?請在 .env 設定,產生方式:openssl rand -hex 64}
      ADMIN_USER: ${ADMIN_USER:?請在 .env 設定}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?請在 .env 設定}

      # --- 可調,預設值寫在這裡,要改就在 .env 覆蓋 -------------------------
      DEFAULT_TTL_DAYS: ${DEFAULT_TTL_DAYS:-7}        # 0 = 永不過期
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}

      # 預設 0 = 純 HTTP。放到公開網路請設 1,並在前面擺一台終結 TLS 的 proxy
      FORCE_SSL: ${FORCE_SSL:-0}

      # direct upload 的 PUT 會佔住一條 thread 直到傳完,
      # 想同時傳很多個大檔就把這個數字調高
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}

      TZ: ${TZ:-Asia/Taipei}

      # Solid Queue 跑在 Puma 行程內,不開獨立容器
      SOLID_QUEUE_IN_PUMA: "1"
    volumes:
      # named volume,不要用 bind mount —— 容器裡跑的是非 root 的 rails 使用者,
      # bind mount 的目錄在 host 上是 root 所有,SQLite 會直接開不起來。
      # 備份用 `docker compose cp` 或臨時掛一個 busybox。
      #
      # SQLite 的四個 db 檔和 ActiveStorage 的 blob 都在 storage/ 底下,
      # 所以只需要這一個 volume。
      - storage:/rails/storage

volumes:
  storage:
